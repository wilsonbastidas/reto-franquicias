server:
  port: 8080
spring:
  application:
    name: "MsFranchises"
  devtools:
    add-properties: false
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

aws:
  region: "us-east-1"
  rds:
    secret-name: "franchises/db-credentials"
  secret:
    endpoint: "http://localhost:4566"

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
